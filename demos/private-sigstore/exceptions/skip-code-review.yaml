# PolicyException: waive the code-review requirement, and nothing else.
#
# WHY THIS WORKS THE WAY IT DOES
#
# For an ImageValidatingPolicy, a PolicyException is all-or-nothing at the
# POLICY level. Kyverno's IVP evaluator skips the whole policy when an exception
# matches, and the IVP CEL environment exposes no `exceptions` variable: the
# `exceptions.allowedValues` / `exceptions.allowedImages` escape hatch exists
# only for ValidatingPolicy, MutatingPolicy and GeneratingPolicy.
#
# So you cannot waive one validation inside a policy. Exception granularity
# equals policy granularity, which is exactly why the attestations here live in
# five separate policies. This exception names one of them; provenance, SBOM,
# vulnerability scan and build metadata all stay enforced.
#
# WHY matchConditions AND NOT spec.images
#
# Since Kyverno 1.19.1 (GHSA-5cjf-wwfg-pj4c), an IVP exception that sets
# `spec.images` or `spec.allowedValues` is IGNORED, silently: no error, no
# event. Before that fix it waived every image in the pod, including ones never
# listed. Partial IVP exceptions are tracked in kyverno/kyverno#18292.
# Until then, scope by image with a CEL matchCondition:
#   * `.all(...)`: EVERY container must be the waived image. One other image in
#     the pod makes the condition false, so the waiver does not apply.
#   * The policy also runs on Deployments, Jobs, CronJobs (autogen), and this
#     expression is evaluated for them too. Reading only `object.spec.containers`
#     throws on a Deployment, and with failurePolicy: Fail that blocks EVERY
#     Deployment in the cluster. So find the pod spec wherever it lives.
#   * initContainers / ephemeralContainers are not checked here; the other four
#     policies still verify every image.
#
# Scope it as tightly as the situation allows:
#   * policyRefs      — only verify-code-review
#   * matchConditions — only the image that actually needs the waiver
#   * reportResult    — recorded as "skip" in policy reports, so it stays visible
#
# There is no expiry knob: policies.kyverno.io/v1 PolicyException has no
# `expiresAt` field (that belongs to the older kyverno.io/v2 type). Ageing a
# waiver out has to happen outside the resource — delete it, or gate it in Git.
apiVersion: policies.kyverno.io/v1
kind: PolicyException
metadata:
  name: skip-code-review-demo-private
  namespace: kyverno
  annotations:
    # Say why, and who owns it. An undocumented exception is indistinguishable
    # from a hole someone forgot to close.
    nirmata.io/justification: >-
      Demo image is built by a direct push to main, which has zero approving
      reviews. Waived so the remaining four attestation policies can be
      demonstrated end to end.
    nirmata.io/owner: platform-security
spec:
  policyRefs:
    - kind: ImageValidatingPolicy
      name: verify-code-review
  matchConditions:
    - name: only-the-demo-image
      expression: >-
        (object.kind == "CronJob" ? object.spec.jobTemplate.spec.template.spec
         : has(object.spec.template) ? object.spec.template.spec
         : object.spec).containers.all(c,
           c.image.startsWith("ghcr.io/nirmata/demo-private-attestations:attested"))
  reportResult: skip
