# Verify the Trivy vulnerability-scan attestation, and check its CONTENT.
#
# This is the payload-checking example: the signature proves the scan came from
# the central workflow; the second validation reads the scan report itself and
# denies the image if it found anything CRITICAL.
apiVersion: policies.kyverno.io/v1
kind: ImageValidatingPolicy
metadata:
  name: verify-vuln-scan
  annotations:
    policies.kyverno.io/title: Verify vulnerability scan (no CRITICAL findings)
    policies.kyverno.io/category: Software Supply Chain Security
    policies.kyverno.io/minversion: 1.19.0
    policies.kyverno.io/description: >-
      Verifies the Trivy vulnerability-scan attestation and denies the image if
      the scan reported any CRITICAL severity vulnerability.

      Caveat for anyone reading this as a worked example: Trivy finds nothing in
      the demo image, so its report has no top-level `Results` key at all and
      the CRITICAL check passes on the absent-key guard rather than on scanned
      content. The guard is necessary — a missing key is an evaluation error,
      which under failurePolicy: Fail denies the image and looks like a real
      finding — but it means this policy has only been exercised against a clean
      report. Point it at an image with known CRITICALs before trusting it.
spec:
  validationActions: [Deny]
  failurePolicy: Fail
  webhookConfiguration:
    timeoutSeconds: 30
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
  matchImageReferences:
    - glob: "ghcr.io/nirmata/demo-private-attestations*"
  credentials:
    secrets:
      - ghcr-pull-secret
  variables:
    - name: githubTrustedRoot
      expression: >-
        resource.get("v1", "configmaps", "kyverno", "github-trusted-root").data["trusted_root.json"]
  attestations:
    - name: vulnScan
      intoto:
        type: "https://nirmata.com/attestations/vulnerability-scan/v1"
  attestors:
    - name: github
      cosign:
        keyless:
          identities:
            - issuer: "https://token.actions.githubusercontent.com"
              subjectRegExp: "^https://github\\.com/nirmata/demo-attestations-kyverno/\\.github/workflows/reusable-build-attest\\.yml@refs/(heads/main|tags/v.*)$"
        trustedRoot:
          expression: variables.githubTrustedRoot
        ctlog:
          insecureIgnoreTlog: true
          insecureIgnoreSCT: true
  validations:
  # ONE validation, ONE verify call — this is not stylistic.
  #
  # `extractPayload` can only read an attestation verified *in the same CEL
  # expression*; verification state does not carry across validations. And
  # Kyverno's image-verification cache (--imageVerifyCacheEnabled, on by
  # default) makes a repeat `verifyAttestationSignatures` for the same image a
  # cache hit that returns the count WITHOUT repopulating the payload store, so
  # a second call in a second validation yields
  #   "intoto attestation payload cannot be fetch before verifying intoto attestation"
  # which under failurePolicy: Fail denies the image.
  #
  # So: verify once, then chain every payload assertion off that one call with
  # `&&`. The cost is a single combined message per policy.
    - expression: >-
        images.containers.map(image,
          verifyAttestationSignatures(image, attestations.vulnScan, [attestors.github]) > 0 &&
          (!has(extractPayload(image, attestations.vulnScan).predicate.Results) ||
           extractPayload(image, attestations.vulnScan).predicate.Results.all(r,
             !has(r.Vulnerabilities) ||
             r.Vulnerabilities.all(v, v.Severity != "CRITICAL")))
        ).all(e, e)
      message: >-
        Vulnerability-scan check failed: signature must verify and the Trivy report must contain no CRITICAL findings
