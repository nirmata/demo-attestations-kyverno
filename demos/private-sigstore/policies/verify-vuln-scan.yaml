# Verify the Trivy vulnerability-scan attestation, and check its CONTENT.
#
# This is the payload-checking example: the signature proves the scan came from
# the central workflow; the second validation reads the scan report itself and
# denies the image if it found anything CRITICAL.
apiVersion: policies.kyverno.io/v1
kind: ImageValidatingPolicy
metadata:
  name: verify-vuln-scan
  annotations:
    policies.kyverno.io/title: Verify vulnerability scan (no CRITICAL findings)
    policies.kyverno.io/category: Software Supply Chain Security
    policies.kyverno.io/minversion: 1.19.0
    policies.kyverno.io/description: >-
      Verifies the Trivy vulnerability-scan attestation and denies the image if
      the scan reported any CRITICAL severity vulnerability.

      Caveat for anyone reading this as a worked example. Against the demo image
      (alpine 3.20.10) Trivy finds zero vulnerabilities, so the report carries a
      `Results` list of one entry that has no `Vulnerabilities` key at all. The
      `Results` iteration and the missing-`Vulnerabilities` guard are therefore
      exercised, but the `Severity != "CRITICAL"` comparison itself is NOT — an
      empty set makes `all()` vacuously true no matter what it says. Point this
      at an image with known CRITICALs before trusting that clause.

      Both guards are load-bearing, not defensive noise: a missing key is an
      evaluation error, and under failurePolicy: Fail an error denies the image
      with a message that reads like a real finding.
spec:
  validationActions: [Deny]
  failurePolicy: Fail
  webhookConfiguration:
    timeoutSeconds: 30
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
  matchImageReferences:
    - glob: "ghcr.io/nirmata/demo-private-attestations*"
  credentials:
    secrets:
      - ghcr-pull-secret
  variables:
    - name: githubTrustedRoot
      expression: >-
        resource.get("v1", "configmaps", "kyverno", "github-trusted-root").data["trusted_root.json"]
    - name: vulnScanPayload
      expression: >-
        images.containers.map(image,
          verifyAttestationSignatures(image, attestations.vulnScan, [attestors.github]) > 0
            ? extractPayload(image, attestations.vulnScan)
            : dyn(null))
  attestations:
    - name: vulnScan
      intoto:
        type: "https://nirmata.com/attestations/vulnerability-scan/v1"
  attestors:
    - name: github
      cosign:
        keyless:
          identities:
            - issuer: "https://token.actions.githubusercontent.com"
              subjectRegExp: "^https://github\\.com/nirmata/demo-attestations-kyverno/\\.github/workflows/reusable-build-attest\\.yml@refs/(heads/main|tags/v.*)$"
        trustedRoot:
          expression: variables.githubTrustedRoot
        ctlog:
          insecureIgnoreTlog: true
          insecureIgnoreSCT: true
  validations:
  # WHY THE PAYLOAD IS A VARIABLE — this is not stylistic.
  #
  # `extractPayload` can only read an attestation that was verified in the SAME
  # evaluation. Verification state does not carry from one `validations` entry
  # to the next, so a bare `extractPayload` in a later validation fails with
  #   "intoto attestation payload cannot be fetch before verifying intoto attestation"
  # and, under failurePolicy: Fail, denies the image.
  #
  # A `variables` entry is one evaluation shared by every validation. Verify and
  # extract together there, once, and each validation below can then assert one
  # thing and carry its own message. The alternative — chaining every assertion
  # off a single `verifyAttestationSignatures(...) > 0 &&` in one expression —
  # works too but collapses every failure into one message.
  #
  # `dyn(null)` is what makes the ternary type-check; a null payload means the
  # signature did not verify, which the first validation reports. Every later
  # validation re-checks `p != null` so a signature failure surfaces as that
  # first clean message rather than as an evaluation error on a null.
    - expression: >-
        variables.vulnScanPayload.all(p, p != null)
      message: "Failed to verify vulnerability-scan attestation"


    # ── Payload check: content, not just signature ──────────────────────────
    # Trivy's report is the predicate. `Results` is absent when nothing was
    # scanned, and a result may carry no `Vulnerabilities` array, so guard both
    # — a missing key is an evaluation error, which under failurePolicy: Fail
    # denies the image and looks like a real finding.
    - expression: >-
        variables.vulnScanPayload.all(p, p != null &&
          (!has(p.predicate.Results) ||
           p.predicate.Results.all(r,
             !has(r.Vulnerabilities) ||
             r.Vulnerabilities.all(v, v.Severity != "CRITICAL")))
        )
      message: >-
        Image has CRITICAL severity vulnerabilities in its scan attestation
