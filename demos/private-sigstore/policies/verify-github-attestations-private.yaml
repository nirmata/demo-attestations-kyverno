# ImageValidatingPolicy: verify BOTH the SLSA provenance and the SPDX SBOM
# attestations produced by GitHub's PRIVATE Sigstore instance (private /
# internal repositories).
#
# Requires Kyverno v1.19+ for `cosign.trustedRoot`.
#
# Why this differs from the public-repo policies:
#   * Private-repo attestations are signed by fulcio.githubapp.com, not the
#     Sigstore Public Good instance, so the Public Good TUF trusted root
#     cannot verify them. `cosign.trustedRoot` supplies GitHub's trust
#     material directly (GitHub does not run a TUF server).
#   * GitHub's private instance has NO transparency log and NO CT log; it
#     uses a timestamp authority (timestamp.githubapp.com) instead. Hence
#     insecureIgnoreTlog / insecureIgnoreSCT. Kyverno automatically switches
#     to signed-timestamp verification against the TSA in the trusted root
#     when a Sigstore bundle is detected and the tlog is ignored — so this is
#     not "unverified", it is TSA-verified.
#   * The image itself is private, so Kyverno needs registry credentials.
#
# Both predicates are required: an image carrying provenance but no SBOM (or
# vice versa) is denied. The two validations are kept separate so the denial
# message names which one is missing.
#
# Values are concrete (nirmata); change them only if you fork into another org.
apiVersion: policies.kyverno.io/v1
kind: ImageValidatingPolicy
metadata:
  name: verify-private-github-attestations
  annotations:
    policies.kyverno.io/title: Verify GitHub provenance and SBOM from private Sigstore
    policies.kyverno.io/category: Software Supply Chain Security
    policies.kyverno.io/minversion: 1.19.0
    policies.kyverno.io/description: >-
      Enforces both SLSA provenance and an SPDX SBOM from GitHub Artifact
      Attestations issued by GitHub's private Sigstore instance, using a
      pinned trusted root.
spec:
  validationActions: [Deny]
  failurePolicy: Fail
  webhookConfiguration:
    timeoutSeconds: 30

  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]

  matchImageReferences:
    - glob: "ghcr.io/nirmata/demo-private-attestations*"

  # Credentials used to pull the private image and its attestations.
  # The secret must be a kubernetes.io/dockerconfigjson secret living in the
  # Kyverno namespace (see ../scripts/setup-ghcr-secrets.sh).
  credentials:
    secrets:
      - ghcr-pull-secret

  # GitHub's trusted root, stored as a ConfigMap in the Kyverno namespace.
  # Generated by ../scripts/fetch-trusted-root.sh.
  variables:
    - name: githubTrustedRoot
      expression: >-
        resource.get("v1", "configmaps", "kyverno", "github-trusted-root").data["trusted_root.json"]

  attestations:
    - name: slsa
      intoto:
        type: "https://slsa.dev/provenance/v1"
    - name: sbom
      intoto:
        type: "https://spdx.dev/Document/v2.3"

  attestors:
    - name: github
      cosign:
        keyless:
          # EXACTLY ONE identity, and it is the CENTRAL REUSABLE WORKFLOW.
          #
          # Fulcio sets the certificate SAN from the OIDC `job_workflow_ref`
          # claim — the workflow that ran the signing step. Because every repo
          # in the org delegates to reusable-build-attest.yml, they all share
          # this one signer identity. That is what makes a single org-wide
          # policy possible.
          #
          # It also has to be one entry: the Sigstore bundle verification path
          # rejects more than one with "unsupported: multiple identities are
          # not supported at this time", so a two-identity policy never
          # verifies at all. Cover multiple refs with one anchored regex.
          identities:
            - issuer: "https://token.actions.githubusercontent.com"
              subjectRegExp: "^https://github\\.com/nirmata/demo-attestations-kyverno/\\.github/workflows/reusable-build-attest\\.yml@refs/(heads/main|tags/v.*)$"
        # Pinned GitHub Sigstore trust material. Takes precedence over TUF.
        trustedRoot:
          expression: variables.githubTrustedRoot
        ctlog:
          # GitHub's private instance publishes neither a Rekor log nor SCTs.
          insecureIgnoreTlog: true
          insecureIgnoreSCT: true

  # Order matters. The two signature checks must run BEFORE the caller checks:
  # extractPayload only returns a payload that has already been verified, and
  # errors otherwise.
  validations:
    - expression: >-
        images.containers.map(image, verifyAttestationSignatures(image, attestations.slsa, [attestors.github])).all(e, e > 0)
      message: >-
        Failed to verify SLSA provenance attestation against GitHub's private Sigstore instance
    - expression: >-
        images.containers.map(image, verifyAttestationSignatures(image, attestations.sbom, [attestors.github])).all(e, e > 0)
      message: >-
        Failed to verify SPDX SBOM attestation against GitHub's private Sigstore instance

    # ── Close the "reusable identity" hole ──────────────────────────────────
    # The attestor above proves the CENTRAL WORKFLOW signed this image. It does
    # NOT prove which repo invoked it — any repo able to call the reusable
    # workflow gets the same signer identity. So pin the caller from the
    # verified provenance predicate.
    #
    # repository_owner_id is an immutable numeric ID (nirmata = 7470644). Prefer
    # it over the org name, which changes on rename or transfer and would let a
    # future "nirmata" account impersonate this one.
    - expression: >-
        images.containers.map(image,
          extractPayload(image, attestations.slsa).buildDefinition.internalParameters.github.repository_owner_id == "7470644"
        ).all(e, e)
      message: >-
        Provenance was not produced by a repository owned by the nirmata org (owner id 7470644)

    - expression: >-
        images.containers.map(image,
          extractPayload(image, attestations.slsa).buildDefinition.externalParameters.workflow.repository.startsWith("https://github.com/nirmata/")
        ).all(e, e)
      message: >-
        Provenance caller workflow is not in the nirmata org

    # Reject self-hosted runners, which are easier to subvert than GitHub's.
    - expression: >-
        images.containers.map(image,
          extractPayload(image, attestations.slsa).buildDefinition.internalParameters.github.runner_environment == "github-hosted"
        ).all(e, e)
      message: >-
        Provenance was not produced on a GitHub-hosted runner
