# Verify SLSA provenance — and pin the caller.
#
# One of five per-attestation policies. The split is deliberate: a Kyverno
# PolicyException targets a whole ImageValidatingPolicy, so exception
# granularity equals policy granularity. See ../README.md.
apiVersion: policies.kyverno.io/v1
kind: ImageValidatingPolicy
metadata:
  name: verify-provenance
  annotations:
    policies.kyverno.io/title: Verify SLSA provenance
    policies.kyverno.io/category: Software Supply Chain Security
    policies.kyverno.io/minversion: 1.19.0
    policies.kyverno.io/description: >-
      Verifies the SLSA provenance attestation and pins the calling repository,
      owner and runner from the verified predicate.
spec:
  validationActions: [Deny]
  failurePolicy: Fail
  webhookConfiguration:
    timeoutSeconds: 30
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
  matchImageReferences:
    - glob: "ghcr.io/nirmata/demo-private-attestations*"
  credentials:
    secrets:
      - ghcr-pull-secret
  variables:
    - name: githubTrustedRoot
      expression: >-
        resource.get("v1", "configmaps", "kyverno", "github-trusted-root").data["trusted_root.json"]
    - name: slsaPayload
      expression: >-
        images.containers.map(image,
          verifyAttestationSignatures(image, attestations.slsa, [attestors.github]) > 0
            ? extractPayload(image, attestations.slsa)
            : dyn(null))
  attestations:
    - name: slsa
      intoto:
        type: "https://slsa.dev/provenance/v1"
  attestors:
    - name: github
      cosign:
        keyless:
          # Exactly one identity, and it is the CENTRAL reusable workflow.
          # A second entry fails with "multiple identities are not supported".
          identities:
            - issuer: "https://token.actions.githubusercontent.com"
              subjectRegExp: "^https://github\\.com/nirmata/demo-attestations-kyverno/\\.github/workflows/reusable-build-attest\\.yml@refs/(heads/main|tags/v.*)$"
        trustedRoot:
          expression: variables.githubTrustedRoot
        ctlog:
          # GitHub's private instance has no Rekor log and no CT log.
          insecureIgnoreTlog: true
          insecureIgnoreSCT: true
  validations:
  # WHY THE PAYLOAD IS A VARIABLE — this is not stylistic.
  #
  # `extractPayload` can only read an attestation that was verified in the SAME
  # evaluation. Verification state does not carry from one `validations` entry
  # to the next, so a bare `extractPayload` in a later validation fails with
  #   "intoto attestation payload cannot be fetch before verifying intoto attestation"
  # and, under failurePolicy: Fail, denies the image.
  #
  # A `variables` entry is one evaluation shared by every validation. Verify and
  # extract together there, once, and each validation below can then assert one
  # thing and carry its own message. The alternative — chaining every assertion
  # off a single `verifyAttestationSignatures(...) > 0 &&` in one expression —
  # works too but collapses every failure into one message.
  #
  # `dyn(null)` is what makes the ternary type-check; a null payload means the
  # signature did not verify, which the first validation reports. Every later
  # validation re-checks `p != null` so a signature failure surfaces as that
  # first clean message rather than as an evaluation error on a null.
    - expression: >-
        variables.slsaPayload.all(p, p != null)
      message: "Failed to verify SLSA provenance attestation against GitHub's private Sigstore instance"


    # ── Close the "reusable identity" hole ──────────────────────────────────
    # The attestor proves the CENTRAL workflow signed this image, not which repo
    # invoked it. Anyone able to call the reusable workflow inherits the
    # identity, so pin the caller from the verified predicate.
    # repository_owner_id is immutable (nirmata = 7470644); the org name is not.
    - expression: >-
        variables.slsaPayload.all(p, p != null &&
          p.predicate.buildDefinition.internalParameters.github.repository_owner_id == "7470644"
        )
      message: >-
        Provenance was not produced by a repository owned by the nirmata org (owner id 7470644)
    - expression: >-
        variables.slsaPayload.all(p, p != null &&
          p.predicate.buildDefinition.externalParameters.workflow.repository.startsWith("https://github.com/nirmata/")
        )
      message: >-
        Provenance caller workflow is not in the nirmata org


    # Reject self-hosted runners, which are easier to subvert than GitHub's.
    - expression: >-
        variables.slsaPayload.all(p, p != null &&
          p.predicate.buildDefinition.internalParameters.github.runner_environment == "github-hosted"
        )
      message: >-
        Provenance was not produced on a GitHub-hosted runner
