# Verify SLSA provenance — and pin the caller.
#
# One of five per-attestation policies. The split is deliberate: a Kyverno
# PolicyException targets a whole ImageValidatingPolicy, so exception
# granularity equals policy granularity. See ../README.md.
apiVersion: policies.kyverno.io/v1
kind: ImageValidatingPolicy
metadata:
  name: verify-provenance
  annotations:
    policies.kyverno.io/title: Verify SLSA provenance
    policies.kyverno.io/category: Software Supply Chain Security
    policies.kyverno.io/minversion: 1.19.0
    policies.kyverno.io/description: >-
      Verifies the SLSA provenance attestation and pins the calling repository,
      owner and runner from the verified predicate.
spec:
  validationActions: [Deny]
  failurePolicy: Fail
  webhookConfiguration:
    timeoutSeconds: 30
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
  matchImageReferences:
    - glob: "ghcr.io/nirmata/demo-private-attestations*"
  credentials:
    secrets:
      - ghcr-pull-secret
  variables:
    - name: githubTrustedRoot
      expression: >-
        resource.get("v1", "configmaps", "kyverno", "github-trusted-root").data["trusted_root.json"]
  attestations:
    - name: slsa
      intoto:
        type: "https://slsa.dev/provenance/v1"
  attestors:
    - name: github
      cosign:
        keyless:
          # Exactly one identity, and it is the CENTRAL reusable workflow.
          # A second entry fails with "multiple identities are not supported".
          identities:
            - issuer: "https://token.actions.githubusercontent.com"
              subjectRegExp: "^https://github\\.com/nirmata/demo-attestations-kyverno/\\.github/workflows/reusable-build-attest\\.yml@refs/(heads/main|tags/v.*)$"
        trustedRoot:
          expression: variables.githubTrustedRoot
        ctlog:
          # GitHub's private instance has no Rekor log and no CT log.
          insecureIgnoreTlog: true
          insecureIgnoreSCT: true
  validations:
  # ONE validation, ONE verify call — this is not stylistic.
  #
  # `extractPayload` can only read an attestation verified *in the same CEL
  # expression*; verification state does not carry across validations. And
  # Kyverno's image-verification cache (--imageVerifyCacheEnabled, on by
  # default) makes a repeat `verifyAttestationSignatures` for the same image a
  # cache hit that returns the count WITHOUT repopulating the payload store, so
  # a second call in a second validation yields
  #   "intoto attestation payload cannot be fetch before verifying intoto attestation"
  # which under failurePolicy: Fail denies the image.
  #
  # So: verify once, then chain every payload assertion off that one call with
  # `&&`. The cost is a single combined message per policy.
    - expression: >-
        images.containers.map(image,
          verifyAttestationSignatures(image, attestations.slsa, [attestors.github]) > 0 &&
          extractPayload(image, attestations.slsa).predicate.buildDefinition.internalParameters.github.repository_owner_id == "7470644" &&
          extractPayload(image, attestations.slsa).predicate.buildDefinition.externalParameters.workflow.repository.startsWith("https://github.com/nirmata/") &&
          extractPayload(image, attestations.slsa).predicate.buildDefinition.internalParameters.github.runner_environment == "github-hosted"
        ).all(e, e)
      message: >-
        SLSA provenance check failed: signature must verify against GitHub's private Sigstore instance, and the predicate must show a nirmata-owned repo (owner id 7470644) calling a nirmata workflow on a GitHub-hosted runner
