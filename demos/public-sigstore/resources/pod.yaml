# Test pod for the public-Sigstore policy.
# The image is public, so no imagePullSecrets are needed.
apiVersion: v1
kind: Pod
metadata:
  name: public-attestation-demo
  namespace: default
spec:
  restartPolicy: Never
  containers:
    - name: demo
      image: ghcr.io/nirmata/demo-github-attestations-sbom:attested
      command: ["sh", "-c", "sleep 30"]
