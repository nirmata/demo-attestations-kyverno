# Deletes ALL versions of a demo package from GHCR. Manual trigger only.
#
# These are ORGANIZATION packages, so this uses /orgs/{org}/packages/... —
# the /user/packages/... endpoint operates on the authenticated user's own
# packages and silently finds nothing for an org-owned package.
name: Cleanup GHCR images

on:
  workflow_dispatch:
    inputs:
      package:
        description: Package to delete all versions of
        required: true
        default: demo-github-attestations-sbom
        type: choice
        options:
          - demo-github-attestations-sbom
          - demo-private-attestations
      confirm:
        description: 'Type "DELETE" to confirm'
        required: true
        type: string

permissions:
  packages: write
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    if: github.event.inputs.confirm == 'DELETE'
    steps:
      - name: Delete all package versions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ORG: ${{ github.repository_owner }}
          PACKAGE: ${{ github.event.inputs.package }}
        run: |
          set -euo pipefail
          echo "Cleaning up ghcr.io/${ORG}/${PACKAGE}"

          VERSIONS=$(gh api --paginate \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "/orgs/${ORG}/packages/container/${PACKAGE}/versions" \
            --jq '.[].id' 2>/dev/null || echo "")

          if [ -z "$VERSIONS" ]; then
            echo "No versions found. Nothing to delete."
            exit 0
          fi

          echo "Found $(echo "$VERSIONS" | wc -l | tr -d ' ') version(s)"
          FAILED=0
          for VERSION_ID in $VERSIONS; do
            if gh api --method DELETE \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "/orgs/${ORG}/packages/container/${PACKAGE}/versions/${VERSION_ID}" >/dev/null 2>&1; then
              echo "  deleted ${VERSION_ID}"
            else
              echo "  FAILED  ${VERSION_ID}"
              FAILED=$((FAILED + 1))
            fi
          done

          if [ "$FAILED" -gt 0 ]; then
            echo "Cleanup finished with ${FAILED} failure(s)." >&2
            exit 1
          fi
          echo "Cleanup complete."

  cleanup-cancelled:
    runs-on: ubuntu-latest
    if: github.event.inputs.confirm != 'DELETE'
    steps:
      - run: |
          echo "Cancelled. You must type 'DELETE' to confirm."
          exit 1
