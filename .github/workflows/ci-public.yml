# CALLER workflow — public-Sigstore demo.
#
# Identical in shape to ci-private.yml: inputs only, no build or attest steps.
# Both demos delegate to the same central reusable workflow, which is why both
# produce attestations under the same signer identity and both Kyverno policies
# can use the same single attestor.
#
# This repo is public, so these attestations are signed by the Sigstore Public
# Good instance and logged in Rekor.
name: CI (public attestations)

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "demos/public-sigstore/**"
      - ".github/workflows/ci-public.yml"
      - ".github/workflows/reusable-build-attest.yml"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

jobs:
  build:
    uses: ./.github/workflows/reusable-build-attest.yml
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    with:
      image-name: demo-github-attestations-sbom
      image-tag: attested
      context: ./app
      attest-sbom: true

  # Unattested image for the policy's negative test.
  build-unattested:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9  # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8  # v6
        with:
          context: ./app
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ghcr.io/nirmata/demo-github-attestations-sbom:unattested
          build-args: |
            IMAGE_TYPE=unattested
